<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Member Page</title>
    <script src="/js/editMembers.js" defer></script>
    <link rel="stylesheet" href="/css/editMembers.css">
</head>

<body>
    <!-- Top bar -->
    <div class="top-bar">
        <button id="backBtn">Back</button>
    </div>

    <!-- Main container -->
    <div class="container">
        <h1>Update Member</h1>

        <div class="input-group">
            <label for="studentNumber">Student Number:</label>
            <input type="text" id="studentNumber" placeholder="Enter Student Number" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" placeholder="Enter Last Name" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" placeholder="Enter First Name" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="middleName">Middle Name:</label>
            <input type="text" id="middleName" placeholder="Enter Middle Name" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="sex">Sex:</label>
            <input type="text" id="sex" placeholder="Sex" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="section">Section:</label>
            <input type="text" id="section" placeholder="Section" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Enter Email" autocomplete="off">
        </div>

        

        <div class="button-group">
            <button id="addToDatabaseBtn">Update Member</button>
        </div>

        <p id="message"></p>
    </div>
</body>
</html>
