<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Homecoming</title>
    <script src="/js/editHomecoming.js" defer></script>
    <link rel="stylesheet" href="/css/editHomecoming.css">
</head>

<body>
    <!-- Top bar -->
    <div class="top-bar">
        <button id="backBtn">Back</button>
    </div>

    <!-- Main container -->
    <div class="container">
        <h1>Edit Homecoming Event</h1>

        <!-- Event Name -->
        <div class="input-group">
            <label for="eventName">Event Name:</label>
            <input type="text" id="eventName" placeholder="Enter name of event" autocomplete="off">
        </div>

        <!-- Theme -->
        <div class="input-group">
            <label for="theme">Theme:</label>
            <input type="text" id="theme" placeholder="Enter theme of event" autocomplete="off">
        </div>

        <!-- Date and Time -->
        <div class="input-group">
            <label for="dateTime">Date and Time:</label>
            <input type="datetime-local" id="dateTime" autocomplete="off">
        </div>

        <!-- Venue -->
        <div class="input-group">
            <label for="venue">Venue:</label>
            <input type="text" id="venue" placeholder="Enter venue of event" autocomplete="off">
        </div>

        <!-- Button -->
        <div class="button-group">
            <button id="addToDatabaseBtn">Update Database</button>
        </div>

        <p id="message"></p>
    </div>
</body>
</html>
