<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event</title>
    <script src="/js/addEvent.js" defer></script>
    <link rel="stylesheet" href="/css/addEvent.css">
</head>

<body>
    <!-- Top bar -->
    <div class="top-bar">
        <button id="backBtn">Back</button>
    </div>

    <!-- Main container -->
    <div class="container">
        <h1>Create Event</h1>

        <div class="input-group">
            <label for="nameOfEvent">Name of Event:</label>
            <input type="text" id="nameOfEvent" placeholder="Enter Name of Event" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="startDate">Start Date:</label>
            <input type="date" id="startDate" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="endDate">End Date:</label>
            <input type="date" id="endDate" autocomplete="off">
        </div>


        <div class="input-group">
            <label for="amount">Enter Amount:</label>
            <input type="text" id="amount" placeholder="Enter Amount" autocomplete="off">
        </div>

        <div class="button-group">
            <button id="addToDatabaseBtn">Add to Database</button>
        </div>

        <p id="message"></p>
    </div>
</body>
</html>
