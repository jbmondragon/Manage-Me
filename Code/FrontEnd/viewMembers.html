<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Management</title>
    <link rel="stylesheet" href="/css/viewMembers.css">
    <script src="/js/viewMembers.js" defer></script>
</head>
<body>

    <div class="top-bar">
        <button id="backBtn">Back</button>
    </div>

    <div class="main-container">

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by student number or name">
            <button id="searchBtn">Search</button>
        </div>

        <div class="filter-dropdown">
            <label for="filterSelect">Filter by section:</label>
            <select id="filterSelect">
                <!-- Options will be inserted dynamically -->
            </select>
        </div>

        <div class="members-list">
            <!-- Members will be inserted here dynamically -->
        </div>
    </div>

</body>
</html>
