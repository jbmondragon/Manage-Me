<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Management</title>
    <link rel="stylesheet" href="/css/viewMembers.css">
    <script src="/js/viewMembers.js" defer></script>
</head>
<body>
    
    <!-- Top bar -->
    <div class="top-bar">
        <button id="backBtn">Back</button>
    </div>


    <div class="main-container">
        
        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" placeholder="Student number">
            <button>Search</button>
        </div>

        <!-- Filter Buttons -->
        <div class="filter-buttons">
            <button class="all">All members</button>
            <button class="red">Red</button>
            <button class="orange">Orange</button>
            <button class="yellow">Yellow</button>
            <button class="green">Green</button>
            <button class="blue">Blue</button>
            <button class="violet">Violet</button>
            <button class="academic">Academic</button>
            <button class="tv">TVL</button>
            <!-- <button class="backBtn" id="backBtn">Back</button> -->
        </div>
        <div class="members-list">
            <!-- Members will be inserted here dynamically -->
        </div>
        </div>
    </div>
</body>
</html>
