<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="/js/admin_login_script.js" defer></script>
    <link rel="stylesheet" href="/css/admin_login.css">
</head>

<body>
    <!-- Top bar -->
    <div class="top-bar">
        <!-- <button id="dashboard" class="active">Dashboard</button> -->
        <button id="about">About</button>
        <button id="homeBtn">Home</button>
        <button id="userLoginBtn">User Log-in</button>
    </div>

    <!-- Main container -->
    <div class="container">
        <h1>Admin Login</h1>

        <div class="input-group">
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter username" autocomplete="off">
        </div>

        <div class="input-group password-group">
            <label for="password">Password:</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter password" autocomplete="off">
                <button type="button" id="togglePassword" title="Show/Hide Password">👁️</button>
            </div>
        </div>

        <div class="button-group">
            <button id="loginBtn">Login</button>
            <button id="resetBtn">Reset</button>
        </div>

        <!-- Forgot Password link -->
        <div class="forgot-password">
            <a href="forgot_password.html" id="forgotPasswordLink">Forgot Password?</a>
        </div>

        <p id="message"></p>
    </div>
</body>
</html>
